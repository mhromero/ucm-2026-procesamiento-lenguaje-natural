[project]
name = "fdi-pln-2611-p4"
version = "1.0"
description = "Buscador de texto sobre corpus en español con búsqueda clásica y semántica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
    "ollama>=0.4",
    "numpy>=2.0",
    "spacy>=3.8.11",
    "textual>=8.1.1",
    "typer>=0.15",
]

[project.scripts]
fdi-pln-2611-p4 = "fdi_pln_2611_p4.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdi_pln_2611_p4"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
select = ["E", "F", "I"]
