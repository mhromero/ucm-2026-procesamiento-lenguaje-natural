<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de parrafos</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg: #f4f4ef;
        --card: #ffffff;
        --text: #16202a;
        --muted: #5f6b75;
        --accent: #0f766e;
        --border: #d8dfde;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, #fff7e8 0%, var(--bg) 55%);
        color: var(--text);
      }
      .wrap {
        max-width: 900px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(14, 32, 60, 0.08);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.7rem;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      input {
        flex: 1;
        min-width: 240px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        padding: 10px 16px;
        font-size: 1rem;
        cursor: pointer;
      }
      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .section {
        margin-top: 18px;
      }
      .pbox {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-top: 10px;
        background: #fcfdfc;
      }
      .meta {
        margin: 0 0 8px;
        font-size: 0.92rem;
        color: var(--muted);
      }
      .error {
        margin-top: 12px;
        color: #a31621;
      }
      code {
        background: #edf1f5;
        padding: 2px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      function normalizeWord(raw) {
        return (raw || "").toLowerCase().trim();
      }

      function App() {
        const [vocab, setVocab] = React.useState(null);
        const [parrafos, setParrafos] = React.useState(null);
        const [input, setInput] = React.useState("");
        const [indices, setIndices] = React.useState([]);
        const [error, setError] = React.useState("");
        const [loading, setLoading] = React.useState(true);

        React.useEffect(() => {
          async function loadData() {
            try {
              const [vocabRes, parrafosRes] = await Promise.all([
                fetch("./vocabulario_index.json"),
                fetch("./parrafos_index.json"),
              ]);
              if (!vocabRes.ok || !parrafosRes.ok) {
                throw new Error("No se pudieron cargar los JSON.");
              }
              const [vocabJson, parrafosJson] = await Promise.all([
                vocabRes.json(),
                parrafosRes.json(),
              ]);
              setVocab(vocabJson);
              setParrafos(parrafosJson);
            } catch (e) {
              setError(e.message || "Error cargando datos.");
            } finally {
              setLoading(false);
            }
          }
          loadData();
        }, []);

        function buscar(ev) {
          ev.preventDefault();
          if (!vocab || !parrafos) return;
          setError("");
          const key = normalizeWord(input);
          if (!key) {
            setIndices([]);
            return;
          }
          const out = vocab[key] || [];
          setIndices(out);
        }

        const primerosDos = indices
          .slice(0, 2)
          .map((i) => parrafos.find((p) => p.index === i))
          .filter(Boolean);

        return (
          <div className="wrap">
            <div className="card">
              <h1>Buscador de palabras por parrafo</h1>
              <form className="row" onSubmit={buscar}>
                <input
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder="Escribe una palabra (ej: quijote)"
                />
                <button type="submit">Buscar</button>
              </form>
              <p className="hint">
                Busca en <code>vocabulario_index.json</code> y devuelve indices
                de parrafo + los 2 primeros textos.
              </p>

              {loading && <p className="section">Cargando datos...</p>}
              {error && <p className="error">{error}</p>}

              {!loading && !error && (
                <div className="section">
                  <p>
                    <strong>Coincidencias:</strong> {indices.length}
                  </p>
                  <p>
                    <strong>Indices:</strong>{" "}
                    {indices.length ? indices.join(", ") : "ninguno"}
                  </p>

                  {primerosDos.map((p) => (
                    <div className="pbox" key={p.index}>
                      <p className="meta">
                        parrafo #{p.index}
                        {p.headings?.length
                          ? ` | ${p.headings.join(" > ")}`
                          : ""}
                      </p>
                      <p>{p.text}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
