[server]
host = "127.0.0.1"
port = 7719
log_interval = 60      # segundos entre logs de progreso
dashboard_refresh = 5  # segundos entre refrescos del dashboard
modo_monopuesto = false  # si true, usa parámetro 'agente' en vez de IP para identificar puestos
buzon = false  # si true, habilita el sistema de buzón para cartas
persistencia = "estado_butler.json"  # fichero donde se persiste el estado de la simulación

[simulacion]
# Recursos iniciales por puesto
min_cantidad = 2       # mínimo de cada recurso inicial
max_cantidad = 4       # máximo de cada recurso inicial
num_recursos_extra = 2 # cuántos recursos no-objetivo recibe cada puesto
oro_inicial = 25       # oro total inicial (menos recursos recibidos)

# Objetivos
num_objetivos = 3      # cuántos tipos de recursos son objetivo
min_objetivo = 3       # cantidad mínima de cada objetivo
max_objetivo = 5       # cantidad máxima de cada objetivo

# Balanceo periódico: inyecta recursos si no hay suficientes en circulación
tick = 90                  # segundos entre balanceos
margen = 1.4               # el sistema quiere que haya objetivos*margen recursos (1.3 = 30% extra)
balanceo_porcentaje = 0.1  # fracción del déficit que se inyecta por tick (inyección gradual)

# Generación de alias
remitente_sistema = "Sistema"
nombres = ["ratón", "canguro", "águila", "delfín", "tigre", "zorro", "búho", "oso", "lobo", "halcón", "panda", "koala", "lince", "nutria", "castor", "ciervo", "conejo", "ardilla", "mapache", "tejón"]
adjetivos = ["raudo", "valiente", "sagaz", "astuto", "noble", "feroz", "ágil", "audaz", "diestro", "intrépido", "leal", "tenaz", "vigoroso", "perspicaz", "sereno", "vivaz", "gallardo", "resuelto", "versátil", "ingenioso"]

