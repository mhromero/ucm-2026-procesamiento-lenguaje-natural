[project]
name = "fdi-pln-2611-p5"
version = "1.0"
description = "LM causal y NER sobre Alice in Wonderland (PLN 26/27 UCM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "dynaconf>=3.2",
    "loguru>=0.7",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "rich>=14.0",
    "torch==2.3.1",
    "typer>=0.15",
]

[project.scripts]
fdi-pln-2611-p5 = "fdi_pln_2611_p5.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdi_pln_2611_p5"]

[tool.hatch.build.targets.wheel.force-include]
"fdi_pln_2611_p5/data" = "fdi_pln_2611_p5/data"
"fdi_pln_2611_p5/config.json" = "fdi_pln_2611_p5/config.json"
